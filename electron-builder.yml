appId: com.gamerhub.app
productName: GamerHub
artifactName: GamerHub-${version}-${os}-${arch}.${ext}
files:
  - electron/**
  - package.json
  - '!node_modules/**'
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
